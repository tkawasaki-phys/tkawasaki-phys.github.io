name: Sync publications from ORCID

# 毎週月曜 06:00 JST に走り、業績が増えていればコミットする。
# 手で走らせたいときは Actions タブの "Run workflow" から。
on:
  schedule:
    - cron: "0 21 * * 0"      # UTC 日曜 21:00 = JST 月曜 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and rebuild
        run: python3 tools/sync.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更なし。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "業績を ORCID から同期 ($(date -u +%Y-%m-%d))"
          git push
